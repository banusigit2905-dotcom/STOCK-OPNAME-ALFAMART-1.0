<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Alfamart</title>
    <!-- Library untuk PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="container">
        <h2>📦 Stock Opname Alfamart</h2>
        
        <div class="search-box">
            <input type="text" id="searchPLU" placeholder="🔎 Cari PLU..." onkeyup="filterTable()">
            <input type="text" id="searchDesc" placeholder="🔎 Cari Description..." onkeyup="filterTable()">
        </div>

        <div id="table-wrapper">
            <table id="stockTable">
                <thead>
                    <tr>
                        <th>PLU</th>
                        <th>Description</th>
                        <th>Sistem</th>
                        <th>Fisik</th>
                        <th>Selisih</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
        </div>

        <button class="btn-pdf" onclick="downloadPDF()">📄 Download Hasil ke PDF</button>
    </div>

    <!-- Menghubungkan file JS dan Style -->
    <script src="style.js"></script>
    <script src="script.js"></script>
</body>
</html>
